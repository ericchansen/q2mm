name: Build native CPU images

on:
  workflow_dispatch:
    inputs:
      image:
        description: Image to rebuild
        required: true
        default: all
        type: string
  push:
    branches: [master]
    paths:
      - ".github/envs/*.yml"
      - ".github/docker/Dockerfile"

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.selection.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - run: python scripts/ci_image.py --check
      - id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_IMAGE: ${{ inputs.image }}
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from scripts.ci_paths import changed_paths

          known = json.loads(subprocess.check_output(
              [sys.executable, "scripts/ci_image.py", "--list"], text=True
          ))
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              selected = os.environ["SELECTED_IMAGE"]
              if selected != "all" and selected not in known:
                  raise SystemExit("Unknown image")
              images = known if selected == "all" else [selected]
          else:
              paths = changed_paths(os.environ["BASE"], os.environ["HEAD"])
              images = json.loads(subprocess.check_output(
                  [sys.executable, "scripts/ci_image.py", "--selected", *paths], text=True
              ))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("images=" + json.dumps(images) + "\n")
          PY

  build:
    needs: select
    if: needs.select.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.select.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - id: image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          python scripts/ci_image.py --check
          echo "environment=$(python scripts/ci_image.py "$IMAGE" --field environment)" >> "$GITHUB_OUTPUT"
          echo "reference=$(python scripts/ci_image.py "$IMAGE" --field reference)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .github
          file: .github/docker/Dockerfile
          build-args: ENV_FILE=${{ steps.image.outputs.environment }}
          push: true
          tags: ${{ steps.image.outputs.reference }}
