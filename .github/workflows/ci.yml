name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  PYYAML_FORCE_LIBYAML: "0"
  JAX_PLATFORMS: cpu
  OPENMM_DEFAULT_PLATFORM: CPU

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check q2mm/ test/ scripts/
      - run: python -m ruff format --check q2mm test scripts examples
      - run: python -m mypy q2mm/
      - run: python scripts/check_env_dep_parity.py

  core-py314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[dev]" && python -m pip check
      - run: python -m pytest -m "not (openmm or tinker or jax or jax_md or psi4)" -q

  core-py315:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - run: python -m pip install -e ".[dev]" && python -m pip check
      - run: python -m pytest -m "not (openmm or tinker or jax or jax_md or psi4)" -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --python 3.15 --extra docs
      - run: uv run properdocs build -f properdocs.yml --strict

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - run: python -m pip install build packaging
      - run: python -m build
      - run: python scripts/check_release_artifacts.py --dist-dir dist

  jax-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - run: python -m pip install -e ".[dev,jax]" && python -m pip check
      - run: python -m pytest -m "jax and not cross_backend" -q --junitxml=jax-results.xml
      - run: python scripts/check_test_execution.py jax-results.xml

  qcelemental-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - run: python -m pip install -e ".[dev,qcel]" && python -m pip check
      - run: python -m pytest test/test_io_qcelemental.py -q --junitxml=qcel-results.xml
      - run: python scripts/check_test_execution.py qcel-results.xml

  qcengine-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - run: python -m pip install -e ".[dev,qcengine]" && python -m pip check
      - run: python -m pytest test/test_qcengine_backend.py -q --junitxml=qcengine-results.xml
      - run: python scripts/check_test_execution.py qcengine-results.xml

  ase-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - run: python -m pip install -e ".[dev,ase]" && python -m pip check
      - run: python -m pytest test/test_ase_backend.py -q --junitxml=ase-results.xml
      - run: python scripts/check_test_execution.py ase-results.xml

  parmed-amber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - run: python -m pip install -e ".[dev,amber]" && python -m pip check
      - run: python -m pytest test/test_amber_continuations.py -q --junitxml=amber-results.xml
      - run: python scripts/check_test_execution.py amber-results.xml

  paths:
    runs-on: ubuntu-latest
    outputs:
      openmm-cpu: ${{ steps.changes.outputs['openmm-cpu'] }}
      tinker: ${{ steps.changes.outputs.tinker }}
      jax-md-cpu: ${{ steps.changes.outputs['jax-md-cpu'] }}
      psi4-reference: ${{ steps.changes.outputs['psi4-reference'] }}
      parity-openmm-jax: ${{ steps.changes.outputs['parity-openmm-jax'] }}
      parity-openmm-tinker: ${{ steps.changes.outputs['parity-openmm-tinker'] }}
      parity-jax-jaxmd: ${{ steps.changes.outputs['parity-jax-jaxmd'] }}
      parity-psi4-qcengine: ${{ steps.changes.outputs['parity-psi4-qcengine'] }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/ci_paths.py --base "$BASE" --head "$HEAD"

  openmm-cpu:
    needs: paths
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - if: needs.paths.outputs['openmm-cpu'] == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          AFFECTED: ${{ needs.paths.outputs['openmm-cpu'] }}
        run: |
          case "$AFFECTED" in
            true) bash scripts/ci_local.sh --job openmm-cpu ;;
            false) echo "not affected: openmm-cpu" ;;
            *) echo "::error::path classification failed"; exit 1 ;;
          esac

  tinker:
    needs: paths
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - if: needs.paths.outputs.tinker == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          AFFECTED: ${{ needs.paths.outputs.tinker }}
        run: |
          case "$AFFECTED" in
            true) bash scripts/ci_local.sh --job tinker ;;
            false) echo "not affected: tinker" ;;
            *) echo "::error::path classification failed"; exit 1 ;;
          esac

  jax-md-cpu:
    needs: paths
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - if: needs.paths.outputs['jax-md-cpu'] == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          AFFECTED: ${{ needs.paths.outputs['jax-md-cpu'] }}
        run: |
          case "$AFFECTED" in
            true) bash scripts/ci_local.sh --job jax-md-cpu ;;
            false) echo "not affected: jax-md-cpu" ;;
            *) echo "::error::path classification failed"; exit 1 ;;
          esac

  psi4-reference:
    needs: paths
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - if: needs.paths.outputs['psi4-reference'] == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          AFFECTED: ${{ needs.paths.outputs['psi4-reference'] }}
        run: |
          case "$AFFECTED" in
            true) bash scripts/ci_local.sh --job psi4-reference ;;
            false) echo "not affected: psi4-reference" ;;
            *) echo "::error::path classification failed"; exit 1 ;;
          esac

  parity-openmm-jax:
    needs: paths
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - if: needs.paths.outputs['parity-openmm-jax'] == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          AFFECTED: ${{ needs.paths.outputs['parity-openmm-jax'] }}
        run: |
          case "$AFFECTED" in
            true) bash scripts/ci_local.sh --job parity-openmm-jax ;;
            false) echo "not affected: parity-openmm-jax" ;;
            *) echo "::error::path classification failed"; exit 1 ;;
          esac

  parity-openmm-tinker:
    needs: paths
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - if: needs.paths.outputs['parity-openmm-tinker'] == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          AFFECTED: ${{ needs.paths.outputs['parity-openmm-tinker'] }}
        run: |
          case "$AFFECTED" in
            true) bash scripts/ci_local.sh --job parity-openmm-tinker ;;
            false) echo "not affected: parity-openmm-tinker" ;;
            *) echo "::error::path classification failed"; exit 1 ;;
          esac

  parity-jax-jaxmd:
    needs: paths
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - if: needs.paths.outputs['parity-jax-jaxmd'] == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          AFFECTED: ${{ needs.paths.outputs['parity-jax-jaxmd'] }}
        run: |
          case "$AFFECTED" in
            true) bash scripts/ci_local.sh --job parity-jax-jaxmd ;;
            false) echo "not affected: parity-jax-jaxmd" ;;
            *) echo "::error::path classification failed"; exit 1 ;;
          esac

  parity-psi4-qcengine:
    needs: paths
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - if: needs.paths.outputs['parity-psi4-qcengine'] == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          AFFECTED: ${{ needs.paths.outputs['parity-psi4-qcengine'] }}
        run: |
          case "$AFFECTED" in
            true) bash scripts/ci_local.sh --job parity-psi4-qcengine ;;
            false) echo "not affected: parity-psi4-qcengine" ;;
            *) echo "::error::path classification failed"; exit 1 ;;
          esac
