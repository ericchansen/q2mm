name: q2mm-psi4
# The direct/Psi4-QCEngine jobs share this conda-owned native closure.
channels:
  - conda-forge
dependencies:
  - python=3.15
  - numpy
  - scipy
  - psi4=1.11
  - qcengine
  - pyyaml
  - pydantic>=2.14.1,<3
  - pydantic-settings>=2.16.0,<3
  - pytest
  - setuptools>=80
  - setuptools-scm>=10.3.4
  - pip
