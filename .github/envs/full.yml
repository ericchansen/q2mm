name: q2mm-full
# BEST-EFFORT native lane; core development uses Python 3.15.
channels:
  - bioconda
  - conda-forge
dependencies:
  - python=3.14
  - numpy
  - scipy
  - openmm
  - tinker=8.11.3
  - jax
  - jaxlib
  - jaxopt
  - optax
  - pyyaml
  - pydantic>=2.14.1,<3
  - pydantic-settings>=2.16.0,<3
  - pytest
  - ruff
  - pip
  - pip:
    - jax-md
