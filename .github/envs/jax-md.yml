name: q2mm-jax-md
# Install JAX, jaxlib and JAX-MD together; never replace a conda jaxlib.
channels:
  - conda-forge
dependencies:
  - python=3.14
  - pip
  - pip:
    - jax==0.11.2
    - jaxlib==0.11.2
    - jax-md==0.2.29
    - numpy
    - scipy
    - pyyaml
    - pydantic>=2.14.1,<3
    - pydantic-settings>=2.16.0,<3
    - pytest
    - setuptools>=80
    - setuptools-scm>=10.3.4
