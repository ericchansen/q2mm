name: q2mm-tinker
# Keep Tinker and its native/runtime closure conda-owned.
channels:
  - bioconda
  - conda-forge
dependencies:
  - python=3.15
  - numpy
  - scipy
  - tinker=8.11.3
  - pyyaml
  - pydantic>=2.14.1,<3
  - pydantic-settings>=2.16.0,<3
  - pytest
  - setuptools>=80
  - setuptools-scm>=10.3.4
  - pip
