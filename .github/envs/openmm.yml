name: q2mm-openmm
# OpenMM has no CPython 3.15 wheel. Its Python closure is PyPI-owned.
channels:
  - conda-forge
dependencies:
  - python=3.14
  - pip
  - pip:
    - openmm==8.6.1
    - numpy
    - scipy
    - pyyaml
    - pydantic>=2.14.1,<3
    - pydantic-settings>=2.16.0,<3
    - pytest
    - setuptools>=80
    - setuptools-scm>=10.3.4
