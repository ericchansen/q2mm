[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "q2mm-backend-plugin-fixture"
version = "0.0.0"
description = "Out-of-tree Q2MM backend plugin fixture (test-only; harmonic ENERGY MM backend)"
requires-python = ">=3.10"
# Intentionally no dependencies: the fixture builds against the canonical
# q2mm.backends.contracts already provided by an installed q2mm.  The release
# artifact checker installs it with --no-deps to prove pure entry-point
# discovery against a q2mm wheel.
dependencies = []

# The single internal entry-point group Q2MM discovers plugins on.  The value
# targets the lightweight *descriptor* module (a JSON-safe manifest mapping),
# never the backend implementation module.
[project.entry-points."q2mm.backends"]
harmonic-fixture = "q2mm_fixture_backend.descriptor:MANIFEST"

[tool.setuptools.packages.find]
include = ["q2mm_fixture_backend*"]
namespaces = false
