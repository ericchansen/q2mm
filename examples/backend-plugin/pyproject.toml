[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "q2mm-backend-reference"
version = "1.0.0"
description = "Installable reference implementation of a Q2MM backend API v1 plugin"
requires-python = ">=3.10"
dependencies = ["q2mm"]

[project.entry-points."q2mm.backends"]
harmonic-reference = "q2mm_reference_backend.descriptor:MANIFEST"

[tool.setuptools.packages.find]
include = ["q2mm_reference_backend*"]
namespaces = false
